# better prefix key from C-b to C-a
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# better splitting
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# list of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# better status bar
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g status on
set -g status-position top
set -g status-interval 2
set -g status-justify left
set -g status-style "bg=default,fg=#e0def4"

# sessions on the left: "1: dotfiles  2: work"
set -g status-left-length 100
set -g status-left "#(~/.tmux/scripts/sessions-list.sh '#S')  "

# windows of the current session next to them (smaller, dimmer)
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-style "fg=#6e6a86"
set -g window-status-current-style "fg=#e0def4,underscore"

set -g status-right "%Y-%m-%d %H:%M"

# prefix + {i} to quick switch sessions
# prefix + 1..9 = Nth session
bind 1 run-shell "~/.tmux/scripts/session-goto.sh 1"
bind 2 run-shell "~/.tmux/scripts/session-goto.sh 2"
bind 3 run-shell "~/.tmux/scripts/session-goto.sh 3"
bind 4 run-shell "~/.tmux/scripts/session-goto.sh 4"
bind 5 run-shell "~/.tmux/scripts/session-goto.sh 5"
bind 6 run-shell "~/.tmux/scripts/session-goto.sh 6"
bind 7 run-shell "~/.tmux/scripts/session-goto.sh 7"
bind 8 run-shell "~/.tmux/scripts/session-goto.sh 8"
bind 9 run-shell "~/.tmux/scripts/session-goto.sh 9"

# Alt + 1..9 = window in the current session (no prefix)
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4

# sane scrolling
# enable mouse support
set -g mouse on

# smooth scrolling with tmux 3.1+
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -F \"#{pane_in_mode}\" \"send-keys -M\" \"copy-mode -e; send-keys -M\""
bind -n WheelDownPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "send-keys -M"

# key bindings
# open popup terminal with prefix + o
bind-key o display-popup -E "tmux new-session -t scratch"

# Create new session with prefix + c and switch to it
bind-key c new-session
# Or with a prompt for the session name
bind-key C command-prompt -p "New session name:" "new-session -s '%%'"

# color support
# set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# TMUX plugin manager (keep at the bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
